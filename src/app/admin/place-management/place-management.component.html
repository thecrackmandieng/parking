<div class="app-container">
  <app-header></app-header>

  <div class="main-content">
    <app-sidebar></app-sidebar>

    <div class="content">
      <h2>Place Management</h2>

      <!-- Filtrage par parking -->
      <div class="filter-section">
        <label for="parkingIdFilter">Filtrer par Parking :</label>
        <select id="parkingIdFilter" [(ngModel)]="selectedParkingId" (change)="onParkingSelect()">
          <option [ngValue]="null">Tous les parkings</option>
          <option *ngFor="let parking of uniqueParkings" [ngValue]="isObject(parking) ? parking._id : parking">
            {{ isObject(parking) ? parking.name : parking }}
          </option>
        </select>
      </div>

      <!-- Liste des places -->
      <div class="parking-places">
        <div *ngFor="let place of getFilteredPlaces()"
             class="place-card"
             [ngClass]="{ 'occupied': place.isOccupied, 'free': !place.isOccupied }">

          <span class="place-name">{{ place.name }}</span>
          <span class="parking-id">
            (Parking :
            <ng-container *ngIf="isObject(place.parkingId); else fallback">
              {{ place.parkingId.name }}
            </ng-container>
            <ng-template #fallback>{{ place.parkingId }}</ng-template>
            )
          </span>

          <div *ngIf="place.isOccupied">
            Plaque d'immatriculation : {{ place.licensePlate || 'Inconnue' }}
          </div>
        </div>
      </div>

      <!-- Formulaire ajout -->
      <div class="add-place-form">
        <input [(ngModel)]="newPlaceName" placeholder="Nom de la nouvelle place" />
        <select [(ngModel)]="newParkingId">
          <option [ngValue]="null">Choisir un parking</option>
          <option *ngFor="let parking of uniqueParkings" [ngValue]="isObject(parking) ? parking._id : parking">
            {{ isObject(parking) ? parking.name : parking }}
          </option>
        </select>
        <button (click)="createPlace()">Ajouter Place</button>
      </div>
    </div>
  </div>
</div>
